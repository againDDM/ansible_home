---
- name: Install packages needed to build Caddy with forwardproxy
  apt:
    name:
      - golang-go
      - git
    update_cache: yes

- name: Ensure Caddy config directory exists
  file:
    path: /etc/caddy
    state: directory
    mode: '0755'

- name: Ensure custom Caddy install directory exists
  file:
    path: "{{ proxy_masked_caddy_install_dir }}"
    state: directory
    mode: '0755'

- name: Install xcaddy
  environment:
    GOBIN: /usr/local/bin
  command: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
  args:
    creates: /usr/local/bin/xcaddy

- name: Ensure Go build cache directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/cache/proxy_masked/go-tmp
    - /var/cache/proxy_masked/go-cache
    - /var/cache/proxy_masked/go-mod

- name: Remove broken/incomplete Caddy binary before rebuild
  file:
    path: "{{ proxy_masked_caddy_binary_path }}"
    state: absent
  when: force_rebuild_caddy | default(false)

- name: Build Caddy with naive forwardproxy plugin
  environment:
    TMPDIR: /var/cache/proxy_masked/go-tmp
    GOCACHE: /var/cache/proxy_masked/go-cache
    GOMODCACHE: /var/cache/proxy_masked/go-mod
    XCADDY_SKIP_CLEANUP: "1"
  command: >
    /usr/local/bin/xcaddy build
    --output {{ proxy_masked_caddy_binary_path }}
    --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive
  args:
    creates: "{{ proxy_masked_caddy_binary_path }}"
    chdir: "{{ proxy_masked_caddy_install_dir }}"

- name: Cleanup Go temporary build cache
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/cache/proxy_masked/go-tmp
    - /var/cache/proxy_masked/go-cache

- name: Render Caddy config
  template:
    src: caddy-naive.conf.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
  notify:
    - restart caddy

- name: Install Caddy systemd service
  copy:
    dest: /etc/systemd/system/caddy.service
    mode: '0644'
    content: |
      [Unit]
      Description=Caddy NaiveProxy server
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      ExecStart={{ proxy_masked_caddy_binary_path }} run --environ --config /etc/caddy/Caddyfile --adapter caddyfile
      ExecReload={{ proxy_masked_caddy_binary_path }} reload --config /etc/caddy/Caddyfile --adapter caddyfile
      Restart=on-failure
      RestartSec=5s
      TimeoutStopSec=5s
      LimitNOFILE=1048576

      [Install]
      WantedBy=multi-user.target
  notify:
    - restart caddy

- name: Install cert renewal hook to reload caddy
  copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-caddy.sh
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      systemctl reload caddy || systemctl restart caddy

- name: Enable and start caddy
  systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
