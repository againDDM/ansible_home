- name: Assert required variables
  assert:
    that:
      - proxy_masked_vless_domain is string
      - proxy_masked_vless_domain | length > 0
      - proxy_masked_naive_domain is string
      - proxy_masked_trust_domain is string
      - proxy_masked_email is string
      - proxy_masked_email | length > 0
      - proxy_masked_singbox_vless_ws_path is string
      - proxy_masked_singbox_vless_ws_path | length > 10
      - proxy_masked_singbox_vless_ws_path is regex('^/[a-zA-Z0-9/_.-]+$')
      - proxy_masked_singbox_vless_ws_warp_path is string
      - proxy_masked_singbox_vless_ws_warp_path | length > 10
      - proxy_masked_singbox_vless_ws_warp_path is regex('^/[a-zA-Z0-9/_.-]+$')
      - proxy_masked_singbox_vless_ws_path != proxy_masked_singbox_vless_ws_warp_path
    fail_msg: >
        proxy_masked_vless_domain, proxy_masked_email,
        proxy_masked_singbox_vless_ws_path,
        proxy_masked_singbox_vless_ws_warp_path;
        the paths must start with '/' and contain only allowed characters
        (letters, digits, slash, dot, underscore, hyphen), and must be different.

- name: Include tasks for warp settings
  include_tasks: warp.yml

- name: Include tasks for server setup
  include_tasks: server_setup.yml

- name: Include tasks for caddy naive frontend
  include_tasks: caddy.yml
  when: proxy_masked_naive_domain | length > 0

- name: Include tasks for client provisioning
  include_tasks: generate_clients.yml
